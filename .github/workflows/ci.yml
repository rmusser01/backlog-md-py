name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -v

      - name: Run Bandit
        run: python -m bandit -r src

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run quality baselines
        run: python scripts/check_quality_baseline.py

  package:
    name: Package build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/backlog-md-py-wheel-smoke
          /tmp/backlog-md-py-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/backlog-md-py-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py --help
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py --version
          /tmp/backlog-md-py-wheel-smoke/bin/python -m backlog_py --help
          /tmp/backlog-md-py-wheel-smoke/bin/python -m backlog_py --version
          /tmp/backlog-md-py-wheel-smoke/bin/python -c 'from importlib.resources import files; assert files("backlog_py").joinpath("py.typed").is_file()'

      - name: Generate compatibility release evidence artifacts
        run: |
          mkdir -p release-evidence
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py compat evidence-template \
            --output release-evidence/browser-release-evidence-template.json \
            --command "GitHub Actions CI release evidence template"
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py compat status --json \
            > release-evidence/compat-status.json
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py compat status --json \
            --release-evidence release-evidence/browser-release-evidence-template.json \
            > release-evidence/compat-status-with-release-evidence-template.json

      - name: Upload compatibility release evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-release-evidence
          path: release-evidence/*
          if-no-files-found: warn

      - name: Smoke test SDK-free MCP entry point
        env:
          BACKLOG_PY_STATE_DIR: ${{ runner.temp }}/backlog-md-py-mcp-smoke-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -m venv /tmp/backlog-md-py-mcp-smoke
          /tmp/backlog-md-py-mcp-smoke/bin/python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          /tmp/backlog-md-py-mcp-smoke/bin/python -m pip install "${WHEEL}"
          export MCP_RESPONSE_PATH="${BACKLOG_PY_STATE_DIR}-response.json"
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize"}\n' | /tmp/backlog-md-py-mcp-smoke/bin/backlog-py-mcp > "${MCP_RESPONSE_PATH}"
          cat "${MCP_RESPONSE_PATH}"
          /tmp/backlog-md-py-mcp-smoke/bin/python -c 'import json, os, pathlib; response = json.loads(pathlib.Path(os.environ["MCP_RESPONSE_PATH"]).read_text()); assert "error" not in response, response; assert response["result"]["serverInfo"]["name"] == "backlog-md-py", response'
          /tmp/backlog-md-py-mcp-smoke/bin/python -c 'from backlog_py.mcp.server import create_server; server = create_server(); assert server.name == "backlog-md-py"; assert type(server).__name__ == "SdkFreeMcpServer"'
