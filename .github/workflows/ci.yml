name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -v

      - name: Run Bandit
        run: python -m bandit -r src

  package:
    name: Package build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/backlog-md-py-wheel-smoke
          /tmp/backlog-md-py-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/backlog-md-py-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py --help
          /tmp/backlog-md-py-wheel-smoke/bin/backlog-py --version
          /tmp/backlog-md-py-wheel-smoke/bin/python -m backlog_py --help
          /tmp/backlog-md-py-wheel-smoke/bin/python -m backlog_py --version
          /tmp/backlog-md-py-wheel-smoke/bin/python -c 'from importlib.resources import files; assert files("backlog_py").joinpath("py.typed").is_file()'

      - name: Smoke test MCP extra
        run: |
          python -m venv /tmp/backlog-md-py-mcp-smoke
          /tmp/backlog-md-py-mcp-smoke/bin/python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          /tmp/backlog-md-py-mcp-smoke/bin/python -m pip install "${WHEEL}[mcp]"
          /tmp/backlog-md-py-mcp-smoke/bin/python -c 'from backlog_py.mcp.server import create_server, is_mcp_sdk_available; assert is_mcp_sdk_available(); assert type(create_server()).__name__ == "FastMCP"'
