[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-md-py"
description = "Standalone Python compatibility implementation of Backlog.md"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
  { name = "Robert Musser" },
]
keywords = ["backlog.md", "backlog", "markdown", "mcp", "task-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/rmusser01/backlog-md-py"
Repository = "https://github.com/rmusser01/backlog-md-py"
Issues = "https://github.com/rmusser01/backlog-md-py/issues"

[project.optional-dependencies]
dev = [
  "bandit>=1.7.0",
  "build>=1.2.0",
  "pytest>=8.0.0",
  "twine>=5.0.0",
]
mcp = [
  "mcp>=1.0.0",
]

[project.scripts]
backlog-py = "backlog_py.cli.main:main"
backlog-py-mcp = "backlog_py.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backlog_py = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "backlog_py.__version__" }
