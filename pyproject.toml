[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-md-py"
description = "Standalone Python compatibility implementation of Backlog.md"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
  { name = "Robert Musser" },
]
keywords = ["backlog.md", "backlog", "markdown", "mcp", "task-management"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/rmusser01/backlog-md-py"
Repository = "https://github.com/rmusser01/backlog-md-py"
Issues = "https://github.com/rmusser01/backlog-md-py/issues"
Changelog = "https://github.com/rmusser01/backlog-md-py/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rmusser01/backlog-md-py/tree/main/docs"

[project.optional-dependencies]
dev = [
  "bandit>=1.7.0",
  "build>=1.2.0",
  # The exact baseline parser is verified against mypy 2.3.x diagnostics.
  # Review and re-measure the baseline before raising this ceiling.
  "mypy>=1.11.0,<2.4.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  # Upper bound keeps the blocking lint gate deterministic: new ruff minors can
  # add rules to the selected E/F/W/I/UP/B sets. Raise it deliberately.
  "ruff>=0.16.1,<0.17.0",
  "twine>=5.0.0",
]
tui = [
  "textual>=0.86.0",
]

[project.scripts]
backlog-py = "backlog_py.cli.main:main"
backlog-py-mcp = "backlog_py.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backlog_py = [
  "py.typed",
  "browser/assets/*.css",
  "browser/assets/*.js",
  # Vendored third-party notices (e.g. mermaid.min.js.VENDOR.md) must ship with
  # the code they cover; the vendored Mermaid bundle is MIT licensed.
  "browser/assets/*.md",
  "browser/templates/*.html",
  "tui/styles.tcss",
]

[tool.setuptools.dynamic]
version = { attr = "backlog_py.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Ratchet list. Every entry below is measured exactly by
# scripts/check_quality_baseline.py, the source of truth for diagnostic counts.
# Fix the code, then update the script and this list in the same reviewed change.
# The counts were taken with ruff 0.16.1 as:
#   ruff check --select <RULE> --statistics src tests   # with `ignore` emptied
ignore = [
  # 45 lines over the 120-char limit (39 src, 6 tests); the longest single line
  # is 777 chars in src/backlog_py/compat/inventory.py.
  "E501",
  # 59 unsorted/ungrouped import blocks (30 src, 29 tests).
  # `ruff check --select I001 --fix src tests` clears this in one pass.
  "I001",
  # 32 uses of `datetime.timezone.utc` instead of `datetime.UTC` (21 src, 11 tests).
  "UP017",
  # 21 deprecated `typing` imports (typing.Iterable/Sequence/... vs collections.abc).
  "UP035",
  # 13 quoted annotations that no longer need quoting under PEP 563.
  "UP037",
  # 4 `raise` statements inside `except` without `from err` / `from None`.
  "B904",
  # 2 `getattr()` calls with a constant attribute name.
  "B009",
]

[tool.ruff.lint.per-file-ignores]
# `_build_indexed_task_sources` returns `list["IndexedTaskSource"]` where the
# name comes from a deliberate function-local import (circular-import break).
"src/backlog_py/core/repository.py" = ["F821"]
# No `src/**` module is exempt from F401 any more. The four entries that used to
# live here (indexing/sqlite.py, mcp/protocol.py, orchestration/service.py,
# search/simple.py) were removed once the last unused import was deleted; a
# per-file ignore that no longer matches a real violation silently masks the
# *next* unused import, which is exactly what the ratchet exists to catch.
# Test modules: 18 unused imports, 1 redefinition, and 5 late imports guarded by
# an optional-dependency `pytest.importorskip`.
"tests/**" = ["E402", "F401", "F811"]

[tool.mypy]
# Deliberately lenient: this is the first type-checking pass over ~19k lines that
# were never type checked. No strict flags, third-party stubs are not required.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_unused_configs = true
# scripts/check_quality_baseline.py is the source of truth for the exact
# per-file baseline. It runs `python -m mypy` with no arguments so this `files`
# target remains authoritative. The original review measured 60 errors in 14
# files, including one mcp/http_server.py [str-bytes-safe] error. Task 6's IPv6
# URL fix intentionally normalized that server address through str(host) and
# int(port), leaving the reviewed branch baseline at 59 errors in 13 files.
# Reduce the checked-in baseline in the same reviewed change as each further
# type fix, then start enabling strict flags here.
