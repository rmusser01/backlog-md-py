[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-md-py"
version = "0.1.0"
description = "Standalone Python compatibility implementation of Backlog.md"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "click>=8.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.0",
  "pytest>=8.0.0",
]

[project.scripts]
backlog-py = "backlog_py.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
